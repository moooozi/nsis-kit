name: Validate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NSIS
        shell: cmd
        run: choco upgrade nsis --yes --no-progress
      - name: Validate
        shell: cmd
        run: python ci.py
