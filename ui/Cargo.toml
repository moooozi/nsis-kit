[package]
name = "native_nsis_ui"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately independent of the application and its release workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "svg_probe"
required-features = ["native-svg"]

[features]
default = []
native-svg = ["dep:windows"]
installer = ["native-svg"]
# Compile ONLY into the isolated mock-test target directory, never a real installer.
fixture-engine = ["installer"]

[dependencies]

windows = { version = "0.61.3", optional = true, default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_DataExchange",
    "Win32_Security",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Diagnostics_Debug",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
        "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
